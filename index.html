<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Gioia Mundo — Te Vila</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #0b0c10;
      --text: #f5f7ff;
      --muted: #b8bfd8;
      --line: #232843;
      --card: rgba(18, 20, 32, 0.78);
      --glass: rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        "Montserrat",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          900px 500px at 20% 10%,
          rgba(124, 92, 255, 0.22),
          transparent 60%
        ),
        radial-gradient(
          700px 500px at 90% 20%,
          rgba(46, 229, 157, 0.14),
          transparent 55%
        ),
        linear-gradient(
          180deg,
          #070810,
          var(--bg)
        );
    }

    img {
      display: block;
      max-width: 100%;
    }

    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      padding: 36px 0 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 650px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      font-weight: 300;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 640px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
    }

    .main-photo {
      position: relative;
      min-height: 650px;
    }

    .main-photo img {
      width: 100%;
      height: 650px;
      object-fit: cover;
    }

    .photo-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 70px 28px 28px;

      background: linear-gradient(
        180deg,
        transparent,
        rgba(0, 0, 0, 0.88)
      );
    }

    .photo-overlay h2 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 500;
    }

    .photo-overlay p {
      margin: 0;
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      line-height: 1.6;
    }

    .side {
      display: grid;
      gap: 20px;
    }

    .side-photo {
      position: relative;
    }

    .side-photo img {
      width: 100%;
      height: 390px;
      object-fit: cover;
    }

    .side-content {
      padding: 28px;
    }

    .side-content h2 {
      margin: 0 0 12px;
      font-size: 25px;
      font-weight: 500;
    }

    .side-content p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
      font-weight: 300;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-top: 20px;
      background: var(--line);
      border-top: 1px solid var(--line);
    }

    .detail {
      padding: 18px;
      background: rgba(11, 12, 16, 0.95);
    }

    .detail span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .detail strong {
      font-size: 13px;
      font-weight: 400;
    }

    footer {
      padding: 36px 0 20px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 850px) {
      .wrap {
        padding: 16px;
      }

      header {
        padding-top: 24px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .main-photo {
        min-height: 0;
      }

      .main-photo img {
        height: auto;
        max-height: 700px;
        object-fit: cover;
      }

      .side-photo img {
        height: auto;
        max-height: 600px;
      }
    }

    @media (max-width: 520px) {
      .card {
        border-radius: 20px;
      }

      .photo-overlay {
        padding: 60px 20px 20px;
      }

      .photo-overlay h2 {
        font-size: 24px;
      }

      .side-content {
        padding: 22px;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <header>
      <p class="eyebrow">Gioia Mundo</p>

      <h1>Te Vila</h1>

      <p class="intro">
        A visual story by Gioia Mundo.
      </p>
    </header>

    <section class="layout">

      <!-- TE VILA -->
      <article class="card main-photo">

        <img
          src="./te-vila.jpg"
          alt="Te Vila"
        >

        <div class="photo-overlay">
          <h2>Te Vila</h2>

          <p>
            Gioia Mundo
          </p>
        </div>

      </article>


      <div class="side">

        <!-- COWGIRL -->
        <article class="card side-photo">

          <img
            src="./cowgirl.jpg"
            alt="Cowgirl"
          >

        </article>


        <article class="card">

          <div class="side-content">

            <p class="eyebrow">
              Gioia Mundo
            </p>

            <h2>Te Vila</h2>

            <p>
              A visual world shaped by movement, character
              and atmosphere.
            </p>

          </div>

          <div class="details">

            <div class="detail">
              <span>Artist</span>
              <strong>Gioia Mundo</strong>
            </div>

            <div class="detail">
              <span>Project</span>
              <strong>Te Vila</strong>
            </div>

            <div class="detail">
              <span>Image</span>
              <strong>Cowgirl</strong>
            </div>

          </div>

        </article>

      </div>

    </section>

    <footer>
      © Gioia Mundo
    </footer>

  </main>

</body>
</html>
