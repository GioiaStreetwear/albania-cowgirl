<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Gioia Mundo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #0b0c10;
      --text: #f5f7ff;
      --muted: #b8bfd8;
      --line: #232843;
      --card: rgba(18,20,32,.75);
      --glass: rgba(0,0,0,.40);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background:
        radial-gradient(
          900px 500px at 20% 10%,
          rgba(124,92,255,.22),
          transparent 60%
        ),
        radial-gradient(
          700px 500px at 90% 20%,
          rgba(46,229,157,.14),
          transparent 55%
        ),
        linear-gradient(180deg, #070810, var(--bg));

      min-height: 100vh;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .layout {
      display: grid;
      gap: 20px;
      grid-template-columns: 640px 1fr;
      align-items: start;
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      overflow: hidden;
    }

    /* MAP */

    .mapCard {
      padding: 14px;
    }

    .map {
      position: relative;
      height: 520px;
      border-radius: 18px;
      overflow: hidden;
    }

    .map iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .mapOverlay {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    .badge {
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      font-weight: 800;
      font-size: 13px;
      max-width: 75%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(10px);
      color: var(--text);
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      white-space: nowrap;
    }

    .ctaWrap {
      margin-top: 14px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffffff, #eaeaff);
      color: #000;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 12px 40px rgba(124,92,255,.25);
    }

    /* INFO */

    .side {
      padding: 30px;
      display: grid;
      gap: 22px;
    }

    .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      letter-spacing: .55em;
      text-transform: uppercase;
      font-size: 18px;
      line-height: 1.6;
    }

    .text {
      color: var(--muted);
      line-height: 1.8;
      font-size: 16px;
      margin: 0;
    }

    .highlight {
      color: var(--text);
      font-size: 20px;
      line-height: 1.6;
      font-weight: 500;
      margin: 0;
    }

    .coords {
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }

    @media (max-width: 600px) {
      .wrap {
        padding: 12px;
      }

      .map {
        height: 440px;
      }

      .mapOverlay {
        align-items: flex-start;
      }

      .badge {
        max-width: 60%;
      }

      .side {
        padding: 24px;
      }

      .logo {
        letter-spacing: .4em;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">
    <div class="layout">

      <!-- MAP -->
      <section class="card mapCard">

        <div class="map">

          <div class="mapOverlay">
            <div class="badge" id="badgeText">
              📍 Te Vila
            </div>

            <a
              class="btn"
              id="openMapsBtn"
              target="_blank"
              rel="noopener"
            >
              🗺️ Open Maps
            </a>
          </div>

          <iframe
            id="mapFrame"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>

        </div>

        <div class="ctaWrap">
          <a
            class="cta"
            id="streetBtn"
            target="_blank"
            rel="noopener"
          >
            👣 Bekijk in Street View
          </a>
        </div>

      </section>


      <!-- INFO -->
      <aside class="card side">

        <div class="logo">
          GIOIA MUNDO
        </div>

        <p class="text">
          You find the most amazing art on the streets all over the world.
          We simply love it and connect it with streetwear.
        </p>

        <div class="divider"></div>

        <p class="highlight">
          Find the art somewhere in the club and have a great cocktail
          in this superb bar.
        </p>

        <div class="divider"></div>

        <span class="coords" id="addrText"></span>

      </aside>

    </div>
  </main>


  <script>
    // LOCATION
    const address = "Te Vila, Tirana, Albania";
    const lat = 41.3214994;
    const lng = 19.8180241;
    const zoom = 18;

    // STREET VIEW
    const heading = 180;
    const pitch = 5;
    const fov = 90;

    // GOOGLE MAPS
    const openMapsUrl =
      `https://www.google.com/maps/@?api=1&map_action=map&center=${lat},${lng}&zoom=${zoom}&basemap=satellite`;

    // STREET VIEW
    const streetViewUrl =
      `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}&heading=${heading}&pitch=${pitch}&fov=${fov}`;

    // EMBEDDED SATELLITE MAP
    const embedUrl =
      `https://www.google.com/maps?output=embed&z=${zoom}&t=k&ll=${lat},${lng}`;

    // SET CONTENT
    document.getElementById("badgeText").textContent =
      `📍 ${address}`;

    document.getElementById("addrText").textContent =
      `${address} — ${lat}, ${lng}`;

    document.getElementById("openMapsBtn").href =
      openMapsUrl;

    document.getElementById("streetBtn").href =
      streetViewUrl;

    document.getElementById("mapFrame").src =
      embedUrl;
  </script>

</body>
</html>
