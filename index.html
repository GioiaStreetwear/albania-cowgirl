<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gioia Mundo — street art, streetwear and places around the world.">

  <title>Gioia Mundo — Te Vila</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #0b0c10;
      --text: #f5f7ff;
      --muted: #b8bfd8;
      --line: #232843;
      --card: rgba(18,20,32,.78);
      --glass: rgba(0,0,0,.48);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          900px 500px at 20% 10%,
          rgba(124,92,255,.22),
          transparent 60%
        ),
        radial-gradient(
          700px 500px at 90% 20%,
          rgba(46,229,157,.14),
          transparent 55%
        ),
        linear-gradient(
          180deg,
          #070810,
          var(--bg)
        );
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: 640px 1fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      overflow: hidden;
    }


    /* -------------------- */
    /* MAP                  */
    /* -------------------- */

    .mapCard {
      padding: 14px;
    }

    .map {
      position: relative;
      height: 520px;
      overflow: hidden;
      border-radius: 18px;
      background: #11131c;
    }

    .map iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .mapOverlay {
      position: absolute;
      z-index: 2;
      top: 14px;
      left: 14px;
      right: 14px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;

      pointer-events: none;
    }

    .badge,
    .mapButton {
      padding: 10px 14px;

      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);

      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: var(--text);

      font-size: 13px;
      font-weight: 700;

      box-shadow: 0 8px 24px rgba(0,0,0,.20);
    }

    .badge {
      max-width: 70%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mapButton {
      text-decoration: none;
      white-space: nowrap;
      pointer-events: auto;
    }

    .mapButton:hover {
      background: rgba(0,0,0,.65);
    }


    /* STREET VIEW BUTTON */

    .ctaWrap {
      margin-top: 14px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 14px 18px;

      border-radius: 999px;

      background: linear-gradient(
        135deg,
        #ffffff,
        #eaeaff
      );

      color: #000;

      font-size: 14px;
      font-weight: 800;

      text-decoration: none;

      box-shadow:
        0 12px 40px rgba(124,92,255,.25);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .cta:hover {
      transform: translateY(-1px);

      box-shadow:
        0 15px 45px rgba(124,92,255,.32);
    }


    /* -------------------- */
    /* RIGHT SIDE           */
    /* -------------------- */

    .side {
      padding: 26px;

      display: grid;
      gap: 20px;
    }

    .logo {
      font-family: "Montserrat", sans-serif;
      font-weight: 300;

      letter-spacing: .55em;
      text-transform: uppercase;

      font-size: 18px;
      line-height: 1.6;
    }


    /* -------------------- */
    /* ARTWORK              */
    /* -------------------- */

    .artwork {
      position: relative;

      overflow: hidden;

      border-radius: 20px;
      border: 1px solid var(--line);

      background: #090a0f;
    }

    .artwork img {
      display: block;

      width: 100%;
      height: 440px;

      object-fit: cover;
      object-position: center 40%;

      transition: transform .6s ease;
    }

    .artwork:hover img {
      transform: scale(1.02);
    }

    .artwork::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 50%,
          rgba(0,0,0,.75) 100%
        );

      pointer-events: none;
    }

    .findMe {
      position: absolute;
      z-index: 2;

      left: 18px;
      bottom: 17px;

      font-family: "Montserrat", sans-serif;
      font-size: 13px;
      font-weight: 500;

      letter-spacing: .22em;
      text-transform: uppercase;

      color: white;
    }


    /* -------------------- */
    /* TEXT                 */
    /* -------------------- */

    .text {
      margin: 0;

      color: var(--muted);

      font-size: 16px;
      line-height: 1.75;
    }

    .highlight {
      margin: 0;

      color: var(--text);

      font-size: 19px;
      font-weight: 400;
      line-height: 1.6;
    }

    .divider {
      height: 1px;

      background: var(--line);

      margin: 2px 0;
    }

    .coords {
      width: fit-content;

      padding: 8px 12px;

      border: 1px solid var(--line);
      border-radius: 999px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.4;
    }


    /* -------------------- */
    /* TABLET / MOBILE      */
    /* -------------------- */

    @media (max-width: 960px) {

      .layout {
        grid-template-columns: 1fr;
      }

      .artwork img {
        height: auto;
        max-height: 650px;
        object-fit: cover;
      }

    }


    @media (max-width: 600px) {

      .wrap {
        padding: 12px;
      }

      .layout {
        gap: 14px;
      }

      .card {
        border-radius: 22px;
      }

      .mapCard {
        padding: 10px;
      }

      .map {
        height: 430px;
        border-radius: 16px;
      }

      .mapOverlay {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .badge,
      .mapButton {
        padding: 9px 11px;
        font-size: 12px;
      }

      .badge {
        max-width: 60%;
      }

      .cta {
        width: 100%;
        justify-content: center;
      }

      .side {
        padding: 18px;
        gap: 18px;
      }

      .logo {
        font-size: 16px;
        letter-spacing: .42em;
      }

      .artwork {
        border-radius: 17px;
      }

      .artwork img {
        width: 100%;
        height: auto;
        max-height: none;
      }

      .findMe {
        left: 15px;
        bottom: 14px;

        font-size: 12px;
      }

      .text {
        font-size: 15px;
      }

      .highlight {
        font-size: 18px;
      }

      .coords {
        font-size: 12px;
      }

    }

  </style>
</head>


<body>

  <main class="wrap">

    <div class="layout">


      <!-- ======================== -->
      <!-- MAP                      -->
      <!-- ======================== -->

      <section class="card mapCard">

        <div class="map">

          <div class="mapOverlay">

            <div
              class="badge"
              id="badgeText">
              📍 Te Vila
            </div>

            <a
              class="mapButton"
              id="openMapsBtn"
              href="#"
              target="_blank"
              rel="noopener noreferrer">
              🗺️ Open Maps
            </a>

          </div>


          <iframe
            id="mapFrame"
            title="Map of Te Vila in Tirana"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>

        </div>


        <div class="ctaWrap">

          <a
            class="cta"
            id="streetBtn"
            href="#"
            target="_blank"
            rel="noopener noreferrer">
            👣 Bekijk in Street View
          </a>

        </div>

      </section>



      <!-- ======================== -->
      <!-- GIOIA MUNDO / ARTWORK    -->
      <!-- ======================== -->

      <aside class="card side">


        <div class="logo">
          GIOIA MUNDO
        </div>


        <!-- COWGIRL ARTWORK -->

        <div class="artwork">

          <img
            src="cowgirl-te-vila.jpg"
            alt="Cowgirl artwork inside Te Vila in Tirana"
          >

          <div class="findMe">
            Find me inside.
          </div>

        </div>


        <!-- INTRO -->

        <p class="text">
          You find the most amazing art on the streets
          all over the world. We simply love it and
          connect it with streetwear.
        </p>


        <div class="divider"></div>


        <!-- TREASURE HUNT -->

        <p class="highlight">
          Find the art somewhere in the club and have
          a great cocktail in this superb bar.
        </p>


        <div class="divider"></div>


        <!-- LOCATION -->

        <span
          class="coords"
          id="addrText">
        </span>


      </aside>

    </div>

  </main>



  <script>

    /* ======================== */
    /* LOCATION                 */
    /* ======================== */

    const address = "Te Vila, Tirana, Albania";

    const lat = 41.3214994;
    const lng = 19.8180241;

    const zoom = 18;


    /* ======================== */
    /* STREET VIEW              */
    /* ======================== */

    const heading = 180;
    const pitch = 5;
    const fov = 90;


    /* ======================== */
    /* GOOGLE MAPS URLS         */
    /* ======================== */

    const openMapsUrl =
      `https://www.google.com/maps/@?api=1` +
      `&map_action=map` +
      `&center=${lat},${lng}` +
      `&zoom=${zoom}` +
      `&basemap=satellite`;


    const streetViewUrl =
      `https://www.google.com/maps/@?api=1` +
      `&map_action=pano` +
      `&viewpoint=${lat},${lng}` +
      `&heading=${heading}` +
      `&pitch=${pitch}` +
      `&fov=${fov}`;


    const embedUrl =
      `https://www.google.com/maps?output=embed` +
      `&z=${zoom}` +
      `&t=k` +
      `&ll=${lat},${lng}`;


    /* ======================== */
    /* APPLY CONTENT            */
    /* ======================== */

    document
      .getElementById("badgeText")
      .textContent =
      `📍 ${address}`;


    document
      .getElementById("addrText")
      .textContent =
      `${address} — ${lat}, ${lng}`;


    document
      .getElementById("openMapsBtn")
      .href =
      openMapsUrl;


    document
      .getElementById("streetBtn")
      .href =
      streetViewUrl;


    document
      .getElementById("mapFrame")
      .src =
      embedUrl;

  </script>

</body>
</html>
